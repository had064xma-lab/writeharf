{topic:"Mystery",title:"The Locked Attic",text:"Every night, Elena heard a faint scratching above her ceiling. The old house had stood empty for years before she bought it, and the attic door was sealed with a rusted padlock nobody could explain. Curiosity finally overcame her caution. She pried the lock loose and climbed the narrow stairs, dust swirling in her flashlight beam. Inside, she found not a creature, but a stack of letters addressed to a woman who had vanished decades earlier. Elena sat in the silence, realizing the house hadn't been haunted by ghosts, but by an unfinished story waiting patiently for someone curious enough to listen.",vocab:[{word:"scratching",phonetic:"/ˈskrætʃɪŋ/",arabic:"خدش، صوت خربشة"},{word:"caution",phonetic:"/ˈkɔːʃən/",arabic:"حذر، احتراس"},{word:"vanished",phonetic:"/ˈvænɪʃt/",arabic:"اختفى"}]},
{topic:"Science Fiction",title:"The Last Signal",text:"Captain Reyes stared at the console as the final transmission flickered across the screen. For three years, the outpost had drifted beyond contact, its crew surviving on recycled air and dwindling hope. Now, a faint signal pulsed from a planet no one had charted. She hesitated, torn between duty and doubt, before finally rerouting power to the long-range receiver. Static crackled, then cleared into a single word repeated over and over: hello. Reyes exhaled slowly, unsure whether she had just found rescue, or something far stranger waiting patiently in the dark beyond their ship.",vocab:[{word:"transmission",phonetic:"/trænzˈmɪʃən/",arabic:"إرسال، بث"},{word:"dwindling",phonetic:"/ˈdwɪndlɪŋ/",arabic:"يتضاءل، يتناقص"},{word:"charted",phonetic:"/ˈtʃɑːrtɪd/",arabic:"مرسوم على خريطة"}]},
{topic:"Historical Fiction",title:"The Cartographer's Secret",text:"In 1531, Marco worked quietly in the back room of a Venetian print shop, correcting maps that merchants trusted with their lives. One evening, a stranger arrived asking for a chart of waters no ship had ever sailed. Marco hesitated, aware that such knowledge could shift the balance of entire kingdoms. He drew the coastline from memory, adding a single deliberate error near the reef, a small deception that would protect his city's rivals from ruin. As the stranger left with the folded parchment, Marco wondered how many empires had risen or fallen on lines drawn by uncertain hands like his.",vocab:[{word:"merchants",phonetic:"/ˈmɜːrtʃənts/",arabic:"تجار"},{word:"deception",phonetic:"/dɪˈsɛpʃən/",arabic:"خداع، تضليل"},{word:"parchment",phonetic:"/ˈpɑːrtʃmənt/",arabic:"رق، ورق قديم"}]},
{topic:"Nature & Survival",title:"Into the Storm",text:"The hikers had ignored the warning signs, certain the clouds would pass before nightfall. By the time the first thunder rolled across the ridge, the trail behind them had already vanished into fog. Wind tore at their jackets as they scrambled toward a rocky outcrop, hearts pounding louder than the rain. Mia gripped her brother's hand, shouting instructions that the storm swallowed whole. For an hour they huddled beneath the stone, waiting for the fury above to exhaust itself. When the sky finally cleared, the mountain looked unchanged, indifferent to how close they had come to disaster.",vocab:[{word:"outcrop",phonetic:"/ˈaʊtkrɒp/",arabic:"نتوء صخري"},{word:"fury",phonetic:"/ˈfjʊri/",arabic:"غضب، عنف شديد"},{word:"indifferent",phonetic:"/ɪnˈdɪfrənt/",arabic:"غير مبالٍ"}]},
{topic:"Philosophy",title:"The Weight of Choice",text:"Every morning, the old professor asked his students the same question: what would you do if no one was watching? Most laughed, assuming the answer was obvious, that they would behave exactly as they always did. But he pressed further, asking them to imagine a single day with no consequences, no reputation to protect, no judgment to fear. Slowly, the room grew quiet. Some admitted they weren't certain who they truly were beneath the habits shaped by other people's eyes. The professor smiled and said nothing more, letting the silence itself become the lesson he had intended to teach.",vocab:[{word:"consequences",phonetic:"/ˈkɒnsɪkwənsɪz/",arabic:"عواقب، نتائج"},{word:"reputation",phonetic:"/ˌ rɛpjʊˈteɪʃən/",arabic:"سمعة"},{word:"intended",phonetic:"/ɪnˈtɛndɪd/",arabic:"مقصود، ينوي"}]},
{topic:"Daily Life",title:"The Morning Train",text:"Sara had taken the same train for six years, yet she still noticed something new each morning. Today, an elderly man sat across from her, carefully folding a letter he had clearly read many times before. He caught her glance and smiled, admitting it was from his daughter who lived abroad and rarely called. Sara nodded, surprised by how easily strangers shared their most private moments in the anonymous rhythm of a commute. As the train slowed at her station, she wished him well, realizing that ordinary journeys often carried quiet stories no one thought to ask about.",vocab:[{word:"elderly",phonetic:"/ˈɛldərli/",arabic:"مسن، كبير السن"},{word:"anonymous",phonetic:"/əˈnɒnɪməs/",arabic:"مجهول الهوية"},{word:"commute",phonetic:"/kəˈmjuːt/",arabic:"التنقل اليومي للعمل"}]},
{topic:"Adventure",title:"The Narrow Pass",text:"The guide warned them twice that the pass was only safe before noon, once the sun softened the ice above the cliffs. Javier ignored the second warning, eager to reach the summit before the others in his group. By midday, a distant crack echoed through the valley, and loose snow began sliding across the narrow ledge ahead of him. He froze, calculating whether to retreat or risk the final stretch alone. Choosing caution over pride, he turned back just as a small avalanche swept across the very path he had almost crossed, and he sat trembling, grateful for his own hesitation.",vocab:[{word:"ledge",phonetic:"/lɛdʒ/",arabic:"حافة صخرية ضيقة"},{word:"retreat",phonetic:"/rɪˈtriːt/",arabic:"يتراجع، انسحاب"},{word:"avalanche",phonetic:"/ˈævəlæntʃ/",arabic:"انهيار جليدي"}]},
{topic:"Psychology",title:"The Silent Room",text:"The therapist's office was quiet except for the ticking clock, and for the first few sessions, Daniel had filled every silence with nervous small talk. Today, he simply sat, unsure what to say about the argument he'd had with his brother the night before. His therapist waited, letting the discomfort stretch longer than felt natural. Eventually, Daniel admitted he was afraid that voicing his anger would make it permanent, real in a way it wasn't yet. She nodded gently, explaining that avoidance often felt safer than honesty, even when honesty was the only path toward genuine relief.",vocab:[{word:"discomfort",phonetic:"/dɪsˈkʌmfərt/",arabic:"عدم الارتياح"},{word:"avoidance",phonetic:"/əˈvɔɪdəns/",arabic:"تجنب"},{word:"genuine",phonetic:"/ˈdʒɛnjʊɪn/",arabic:"حقيقي، أصيل"}]}
